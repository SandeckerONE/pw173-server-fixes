# Send an empty board right before a new one, so the client drops the old
# opened-chest pictures (none = off, empty = on)
seek.clear = empty

# Record client command 197 (Treasures) action types gs refuses (Bulk Seeking etc.)
cmd.log = 197
cmd.log_all = no
# controller -> player object (gplayer_controller + 4, read from CommandHandler)
off.ctrl_imp = 4
