# treasure_hook.conf - PWI 1.7.3 (e344 / t187) server, gs md5 70207fa25a0a0d83a92dc7a62da1fb4c.
# Re-read a second or two after you save it. Start in log mode.
mode = log
# your GM character's role id; check the "role" number in hook.log and fix if different
allow_roles =          # your GM character's role id while testing; "all" when it works

# structure offsets (verified by disassembly)
off.parent = 8
off.runner = 16
off.roleid = 48
# login session (link index / session id), read from send_ls_msg: used so a relog never charges keys
off.csidx = 176
off.cssid = 180

hook.mode = notice1
hook.notice1 = _ZN11gplayer_imp15Lottery_Notice1Eii
# value returned to gs for a handled command: 1 = success (0 makes gs send "invalid action")
hook.ret = 1

type.refresh = 0
type.open = 1
type.seek = 3

# costs from elements.data e344
key_item = 56274
keys_per_seek = 2
cost = 0, 5, 12, 30, 75, 188, 466, 1166, 2998, 4198
aurum_cost = 20
aurum_free = 2

# prizes go to the Treasure Warehouse (official behaviour); withdraw already works in gs
deliver = lotadd
call.count = _ZN11gplayer_imp14CheckItemExistEij : imp, id, count
ok.count = true
call.remove = _ZN11gplayer_imp11RemoveItemsEijib : imp, id, count, 11, true
ok.remove = nonzero
call.lotadd = _ZN11gplayer_imp15AddLotInventoryEjj : imp, id, count
ok.lotadd = any
# warehouse list refresh: GetLotInventory(&n) -> pointer, then send_lot_inv(n, pointer)
call.aux1 = _ZN11gplayer_imp15GetLotInventoryERj : imp, &out1
ok.aux1 = nonzero
call.inv = _ZN18gplayer_dispatcher12send_lot_invEjPj : runner, out1, ret.aux1
pre.inv = aux1
ok.inv = any

# chest board: built here, sent raw (gs has no sender for it). 1.7.6 layout, unconfirmed.
info.send = raw
call.raw = _Z11send_ls_msgPK7gplayerPKvj : parent, buf, len
ok.raw = any
raw.info = u16:434, u8:manager, u32:score, u32:free, u32:nlots, u32:nboxes, lots, boxes
lot.layout = id:u32, count:u32, lot:u8
box.layout = id:u32, box:u32, count:u32, lot:u8

probe.manager = 1
probe.free = 1
probe.score = 0
probe.fill = 0
probe.send = info

state_dir = /opt/treasure_hook/state

